name: CI -> Deploy to Furtin Dev Environment
on:
  push:
    branches: [ deploy/dev_furtini ]
jobs:
  deploy-front:
    runs-on: ubuntu-latest
    environment:
      name: deploy_dev_furtini
    steps:
      - uses: actions/checkout@v2
      # Criação do build
      - name: Setup node 
        uses: actions/setup-node@v3
        with:
          node-version: v20
      - run: npm install
      - run: npm run build
      - run: cp .htaccess ./dist

      # Deploy do front
      - name: Upload from public_html via FTP
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: ./dist  # Corrigido para apontar para dist
          remote_dir: ${{ secrets.FTP_REMOTE_DIR }}
          delete: "false"
